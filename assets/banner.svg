<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulse{0%{r:6;fill-opacity:.5;filter:drop-shadow(0 0 2px #a855f7)}}@keyframes float{0%{transform:translateY(0) scale(1)}}.network-line{stroke:#6366f1;stroke-opacity:.25;stroke-dasharray:8,8;animation:dash 30s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}.pulse-node-2{animation:pulse 4s ease-in-out infinite alternate 1s}.floating-particle{animation:float 6s ease-in-out infinite alternate}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:56px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:500;font-size:22px;fill:#cbd5e1;letter-spacing:.5px}.badge-text{font-weight:600;font-size:14px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".6"><line x1="100" x2="300" y1="80" y2="180" stroke-width="1.5" class="network-line"/><line x1="300" x2="150" y1="180" y2="320" stroke-width="1.5" class="network-line"/><line x1="300" x2="500" y1="180" y2="120" stroke-width="1.5" class="network-line"/><line x1="900" x2="1050" y1="100" y2="220" stroke-width="1.5" class="network-line"/><line x1="1050" x2="880" y1="220" y2="340" stroke-width="1.5" class="network-line"/><line x1="1050" x2="1150" y1="220" y2="330" stroke-width="1.5" class="network-line"/><circle cx="100" cy="80" r="5" fill="#6366f1" class="floating-particle"/><circle cx="300" cy="180" r="8" fill="#a855f7" class="pulse-node"/><circle cx="150" cy="320" r="6" fill="#ec4899" class="floating-particle"/><circle cx="500" cy="120" r="7" fill="#38bdf8" class="pulse-node-2"/><circle cx="900" cy="100" r="6" fill="#a855f7" class="floating-particle"/><circle cx="1050" cy="220" r="9" fill="#ec4899" class="pulse-node"/><circle cx="880" cy="340" r="7" fill="#6366f1" class="pulse-node-2"/><circle cx="1150" cy="330" r="5" fill="#38bdf8" class="floating-particle"/></g><rect width="120" height="4" x="100" y="115" fill="url(#accentGrad)" filter="url(#glow)" rx="2"/><g><text x="0" y="100" class="badge-text" transform="translate(100, 0)">⚡ CURATED KNOWLEDGE ECOSYSTEM ⚡</text><text x="0" y="175" class="title-text" transform="translate(100, 0)">Awesome AI Knowledge Base</text><text x="0" y="225" class="subtitle-text" transform="translate(100, 0)">SaaS Platforms, Open-Source RAG, Vector Search &amp; Knowledge Graphs</text><g transform="translate(100, 0) translate(0, 265)"><rect width="140" height="36" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="18"/><text x="70" y="23" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">🧠 RAG &amp; Vector</text><rect width="180" height="36" x="155" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="18"/><text x="245" y="23" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">🔍 Enterprise Search</text><rect width="170" height="36" x="350" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="18"/><text x="435" y="23" fill="#ec4899" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">🕸️ Knowledge Graphs</text><rect width="150" height="36" x="535" y="0" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="18"/><text x="610" y="23" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Self-Hosted AI</text></g></g></svg>